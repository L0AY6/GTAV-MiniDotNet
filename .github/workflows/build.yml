name: Build GTAV MiniDotNet Loader with Mono

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Download Portable Mono Runtime (x64)
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://mono-project.com" -OutFile "mono.msi"
        7z x mono.msi -omono_ext -y | Out-Null
        New-Item -ItemType Directory -Force -Path "output/scripts/mono"
        $monoDll = Get-ChildItem -Path "mono_ext" -Filter "mono-2.0-sgen.dll" -Recurse | Select-Object -First 1
        Copy-Item $monoDll.FullName "output/scripts/mono/mono-2.0-sgen.dll"
        $libDir = Get-ChildItem -Path "mono_ext" -Filter "mscorlib.dll" -Recurse | Select-Object -First 1
        Copy-Item -Recurse $libDir.Directory.FullName "output/scripts/mono/lib"
        $mcsBat = Get-ChildItem -Path "mono_ext" -Filter "mcs.bat" -Recurse | Select-Object -First 1
        Set-Content -Path "mcs_path.txt" -Value $mcsBat.FullName

    - name: Build C# AOT Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 -o output/scripts

    - name: Build ScriptHookVDotNet3 Mono Shim
      shell: pwsh
      run: |
        $mcs = Get-Content "mcs_path.txt"
        & $mcs -target:library -out:output/scripts/ScriptHookVDotNet3.dll MonoShim/ScriptHookVDotNet3.cs

    - name: Compile C++ ASI Loader (MiniDotNet.asi)
      shell: cmd
      run: |
        if not exist output mkdir output
        cl /LD /EHsc /O2 /MT /std:c++17 Loader\dllmain.cpp /Fe:output\MiniDotNet.asi

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-MonoRelease
        path: output/
