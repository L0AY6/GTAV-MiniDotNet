name: Build GTAV MiniDotNet Loader with Mono

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C# AOT Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 -o output/scripts
        Remove-Item "output/scripts/*.pdb" -ErrorAction SilentlyContinue

    - name: Build ScriptHookVDotNet3 Mono Shim
      shell: pwsh
      run: |
        $csc = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
        & $csc /unsafe /target:library /out:output/scripts/ScriptHookVDotNet3.dll MonoShim/ScriptHookVDotNet3.cs

    - name: Compile C++ ASI Loader (MiniDotNet.asi)
      shell: cmd
      run: |
        if not exist output mkdir output
        cl /LD /EHsc /O2 /MT /std:c++17 Loader\dllmain.cpp /Fe:output\MiniDotNet.asi user32.lib

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-MonoRelease
        path: output/
