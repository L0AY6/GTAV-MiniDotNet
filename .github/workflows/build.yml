name: Build GTAV MiniDotNet Loader with Mono

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Minimal Portable Mono Runtime (x64)
      shell: pwsh
      run: |
        choco install mono -y --no-progress
        $monoRoot = "C:\Program Files\Mono"
        New-Item -ItemType Directory -Force -Path "output/scripts/mono/lib/mono/4.5"
        Copy-Item "$monoRoot\bin\mono-2.0-sgen.dll" "output/scripts/mono/mono-2.0-sgen.dll"
        foreach ($dll in @("mscorlib.dll", "System.dll", "System.Core.dll", "Microsoft.CSharp.dll", "System.Drawing.dll", "System.Windows.Forms.dll")) {
          if (Test-Path "$monoRoot\lib\mono\4.5\$dll") {
            Copy-Item "$monoRoot\lib\mono\4.5\$dll" "output/scripts/mono/lib/mono/4.5/"
          }
        }

    - name: Build C# AOT Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 -o output/scripts
        Remove-Item "output/scripts/*.pdb" -ErrorAction SilentlyContinue

    - name: Build ScriptHookVDotNet3 Mono Shim
      shell: pwsh
      run: |
        & "C:\Program Files\Mono\bin\mcs.bat" -target:library -out:output/scripts/ScriptHookVDotNet3.dll MonoShim/ScriptHookVDotNet3.cs

    - name: Compile C++ ASI Loader (MiniDotNet.asi)
      shell: cmd
      run: |
        if not exist output mkdir output
        cl /LD /EHsc /O2 /MT /std:c++17 Loader\dllmain.cpp /Fe:output\MiniDotNet.asi

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-MonoRelease
        path: output/
