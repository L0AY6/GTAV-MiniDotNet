name: Build GTAV MiniDotNet Loader

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Generate Local ScriptHookV SDK & Copy Headers
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "sdk"
        
        $mainH = @"
        #pragma once
        #include <windows.h>
        #define IMPORT extern "C" __declspec(dllimport)
        IMPORT void scriptRegister(HMODULE module, void(*LP_SCRIPT_MAIN)());
        IMPORT void scriptUnregister(HMODULE module);
        IMPORT void scriptWait(DWORD time);
        #define WAIT scriptWait
        "@
        Set-Content -Path "sdk\main.h" -Value $mainH

        $defFile = @"
        LIBRARY ScriptHookV
        EXPORTS
            scriptRegister
            scriptUnregister
            scriptWait
        "@
        Set-Content -Path "sdk\ScriptHookV.def" -Value $defFile
        cmd /c "lib /def:sdk\ScriptHookV.def /out:sdk\ScriptHookV.lib /machine:x64"

        $dotnetRoot = (Get-Command dotnet).Source | Split-Path
        $nethostDir = Get-ChildItem -Path "$dotnetRoot\packs\Microsoft.NETCore.App.Host.win-x64" -Recurse -Filter "hostfxr.h" | Select-Object -First 1 -ExpandProperty DirectoryName
        Copy-Item "$nethostDir\*.h" -Destination "sdk/" -Force

    - name: Build C# Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 --self-contained false -o output/scripts

    - name: Compile C++ ASI Loader (MiniDotNet.asi - Static Runtime)
      shell: cmd
      run: |
        cl /LD /EHsc /O2 /MT /std:c++17 /I"sdk" Loader\dllmain.cpp /link /LIBPATH:"sdk" ScriptHookV.lib /OUT:output\MiniDotNet.asi

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-Release
        path: output/
