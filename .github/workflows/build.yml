name: Build GTAV MiniDotNet Loader

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Build C# AOT Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 -o output/scripts

    - name: Compile C++ ASI Loader (MiniDotNet.asi)
      shell: cmd
      run: |
        cl /LD /EHsc /O2 /MT /std:c++17 Loader\dllmain.cpp /OUT:output\MiniDotNet.asi

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-Release
        path: output/
