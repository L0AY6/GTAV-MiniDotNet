name: Build GTAV MiniDotNet Full Bridge

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Setup MSVC Compiler
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup Complete Portable Mono Runtime + Compiler
      shell: pwsh
      run: |
        winget install -e --id Mono.Mono --accept-source-agreements --accept-package-agreements --silent
        $monoRoot = "C:\Program Files\Mono"
        New-Item -ItemType Directory -Force -Path "output/scripts/mono/lib/mono/4.5"
        New-Item -ItemType Directory -Force -Path "output/scripts/mono/etc/mono/4.5"
        New-Item -ItemType Directory -Force -Path "output/scripts/mono/mini"
        Copy-Item "$monoRoot\bin\mono-2.0-sgen.dll" "output/scripts/mono/mono-2.0-sgen.dll"
        Copy-Item "$monoRoot\bin\mono.exe" "output/scripts/mono/mini/mono.exe"
        Copy-Item "$monoRoot\etc\mono\4.5\machine.config" "output/scripts/mono/etc/mono/4.5/machine.config"
        Copy-Item "$monoRoot\lib\mono\4.5\mcs.exe" "output/scripts/mono/lib/mono/4.5/mcs.exe"
        foreach ($dll in @("mscorlib.dll", "System.dll", "System.Core.dll", "Microsoft.CSharp.dll", "System.Drawing.dll", "System.Windows.Forms.dll", "System.Xml.dll", "System.Configuration.dll", "Mono.Security.dll")) {
          if (Test-Path "$monoRoot\lib\mono\4.5\$dll") {
            Copy-Item "$monoRoot\lib\mono\4.5\$dll" "output/scripts/mono/lib/mono/4.5/"
          }
        }

    - name: Build C# AOT Core Bridge (MiniDotNet.Core.dll)
      shell: pwsh
      run: |
        dotnet publish CoreBridge/MiniDotNet.Core.csproj -c Release -r win-x64 -o output/scripts
        Remove-Item "output/scripts/*.pdb" -ErrorAction SilentlyContinue

    - name: Build ScriptHookVDotNet3 Mono Shim
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "ShimProj"
        Copy-Item "MonoShim/ScriptHookVDotNet3.cs" "ShimProj/"
        @'
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net48</TargetFramework>
            <AssemblyName>ScriptHookVDotNet3</AssemblyName>
            <AllowUnsafeBlocks>true</AllowUnsafeBlocks>
            <LangVersion>latest</LangVersion>
          </PropertyGroup>
        </Project>
        '@ | Set-Content "ShimProj/ScriptHookVDotNet3.csproj"
        dotnet build ShimProj/ScriptHookVDotNet3.csproj -c Release -o output/scripts
        Remove-Item "output/scripts/*.pdb" -ErrorAction SilentlyContinue

    - name: Compile C++ ASI Loader (MiniDotNet.asi)
      shell: cmd
      run: |
        if not exist output mkdir output
        cl /LD /EHsc /O2 /MT /std:c++17 Loader\dllmain.cpp /Fe:output\MiniDotNet.asi user32.lib

    - name: Upload Built Mod Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-MiniDotNet-FullBridge
        path: output/
